<style>
        body { background-color: #050810; }
        .glass-panel {
            background-color: #0D1425;
            backdrop-filter: blur(8px);
            border: 1px solid #1E293B;
        }
        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            border-color: #00F2FF;
        }
        .input-inset {
            background-color: #050810;
            border: 1px solid #1E293B;
        }
        .input-inset:focus {
            border-color: #00F2FF;
            box-shadow: inset 0 0 8px rgba(0, 242, 255, 0.1);
            outline: none;
        }
        
        /* Flight path animation */
        .flight-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 8s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
        .node-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>

<body class="text-on-background min-h-screen flex selection:bg-primary-container selection:text-white">
<!-- Split Screen Container -->
<div class="flex w-full min-h-screen">
<!-- Left Side: Branding & Visualization (Hidden on Mobile) -->
<div class="hidden lg:flex w-1/2 flex-col justify-between p-margin-desktop relative overflow-hidden bg-surface">
<!-- Animated Background Canvas (Simulated) -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00F2FF" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#1E40AF" stop-opacity="0.2"></stop>
</linearGradient>
</defs>
<!-- Simulated Map Nodes & Routes -->
<circle class="node-pulse" cx="20%" cy="30%" fill="#00F2FF" r="4"></circle>
<circle class="node-pulse" cx="70%" cy="60%" fill="#00F2FF" r="4" style="animation-delay: 1s;"></circle>
<circle class="node-pulse" cx="40%" cy="80%" fill="#00F2FF" r="4" style="animation-delay: 0.5s;"></circle>
<circle class="node-pulse" cx="85%" cy="20%" fill="#00F2FF" r="4" style="animation-delay: 1.5s;"></circle>
<path class="flight-path" d="M 20% 30% Q 45% 10% 70% 60%" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"></path>
<path class="flight-path" d="M 70% 60% Q 55% 70% 40% 80%" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" style="animation-delay: 2s;"></path>
<path class="flight-path" d="M 20% 30% Q 50% 50% 40% 80%" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" style="animation-delay: 4s;"></path>
<path class="flight-path" d="M 70% 60% Q 80% 40% 85% 20%" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" style="animation-delay: 6s;"></path>
</svg>
</div>
<div class="absolute inset-0 bg-gradient-to-br from-transparent to-surface-container-lowest/80 pointer-events-none"></div>
<div class="z-10 relative mt-xl">
<img alt="AIRINDEX Logo" class="w-32 h-32 rounded-sm object-contain mb-8" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9xzWp6l11biIfrGq6WX1IjQqnBDr9IcTE_264-6VPv2FMve_pdXQ-t_M2vA696ySaiRoWucBTXGtSYdFnMe1fZ8f9SHIvcql6AwPmWBbyDwiIwTq0cprJRHdocTD5DDVmFdlCiu2ciCllC-aafyKLC13FR7DlNAyfRvKb7lMvb-AR9sEN5vo7REmYZ2zOynGdqyowqnq_BJXiFjgQErz6osKVXcovX4CGT-xFys8SgQTJbYLHbeoA">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tighter max-w-lg">
                    The national standard for aviation economic intelligence.
                </h1>
</div>
<div class="z-10 relative mb-xl">
<p class="font-data-mono text-data-mono text-outline uppercase tracking-widest flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-container inline-block animate-pulse"></span>
                    Terminal Active • Connected
                </p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest relative z-20 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
<div class="w-full max-w-md glass-panel p-8 md:p-12 rounded-lg flex flex-col gap-8">
<!-- Mobile Logo Fallback -->
<div class="lg:hidden flex justify-center mb-4">
<img alt="AIRINDEX Logo" class="w-16 h-16 rounded-sm object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9xzWp6l11biIfrGq6WX1IjQqnBDr9IcTE_264-6VPv2FMve_pdXQ-t_M2vA696ySaiRoWucBTXGtSYdFnMe1fZ8f9SHIvcql6AwPmWBbyDwiIwTq0cprJRHdocTD5DDVmFdlCiu2ciCllC-aafyKLC13FR7DlNAyfRvKb7lMvb-AR9sEN5vo7REmYZ2zOynGdqyowqnq_BJXiFjgQErz6osKVXcovX4CGT-xFys8SgQTJbYLHbeoA">
</div>
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Secure Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Authenticate to enter the intelligence hub.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-sm-uppercase text-label-sm-uppercase text-on-surface-variant uppercase tracking-wider" for="email">Corporate Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">mail</span>
<input class="w-full input-inset text-on-surface font-body-md text-body-md rounded py-3 pl-10 pr-4 placeholder:text-outline/50 transition-all duration-200" id="email" placeholder="analyst@agency.gov" type="email">
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-baseline">
<label class="font-label-sm-uppercase text-label-sm-uppercase text-on-surface-variant uppercase tracking-wider" for="password">Access Token</label>
<a class="font-label-sm-uppercase text-label-sm-uppercase text-secondary-container hover:text-secondary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full input-inset text-on-surface font-body-md text-body-md rounded py-3 pl-10 pr-4 placeholder:text-outline/50 transition-all duration-200" id="password" placeholder="••••••••••••" type="password">
</div>
</div>
<div class="flex items-center gap-3 mt-2">
<input class="w-4 h-4 rounded-sm bg-surface border-outline-variant text-primary-container focus:ring-primary-container focus:ring-offset-surface-container-lowest" id="remember" type="checkbox">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<button class="w-full bg-primary-container text-white font-label-sm-uppercase text-label-sm-uppercase py-4 rounded uppercase tracking-widest transition-all duration-200 btn-primary border border-transparent mt-4 flex items-center justify-center gap-2" type="submit">
                        Initialize Session
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>


<p class="font-data-mono text-[10px] text-outline text-center mt-4">
                    By accessing this system, you agree to the <a class="text-on-surface-variant hover:text-white underline" href="#">Terms of Service</a> and <a class="text-on-surface-variant hover:text-white underline" href="#">Government Disclaimer</a>.
                </p>
</div>
</div>
